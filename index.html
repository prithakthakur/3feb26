<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I Love You Oshi ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Music -->
<audio id="bgMusic" loop>
  <source src="music/love.mp3" type="audio/mpeg">
</audio>

<!-- Floating Hearts -->
<div class="hearts"></div>

<!-- Main Container -->
<div class="container">
  <h1 id="typing"></h1>

  <p class="subtitle">
    Every heartbeat whispers your name ✨
  </p>

  <button class="love-btn" onclick="showMessage()">💌 Click Me</button>

  <div class="message" id="message">
    <p>
      Oshi,  
      You are my favorite place, my calm, my chaos,  
      and my forever.  
      I love you more than words can ever express ❤️
      love you jaanu💘
    </p>
  </div>

  <!-- Gallery -->
  <div class="gallery">
    <img src="images/oshi1.jpg">
    <img src="images/oshi2.jpg">
    <img src="images/oshi3.jpg">
    <img src="images/oshi4.jpg">
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
